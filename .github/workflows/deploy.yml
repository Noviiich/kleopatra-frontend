name: Deploy to server

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-deploy:
    name: Build, check, and deploy
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Build site
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test production build
        env:
          PLAYWRIGHT_PREVIEW: 'true'
        run: npm run test:e2e

      - name: Deploy over SSH
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_TARGET_DIR: ${{ secrets.SSH_TARGET_DIR }}
        run: |
          set -euo pipefail

          : "${SSH_HOST:?Add the SSH_HOST secret}"
          : "${SSH_USER:?Add the SSH_USER secret}"
          : "${SSH_PRIVATE_KEY:?Add the SSH_PRIVATE_KEY secret}"
          : "${SSH_KNOWN_HOSTS:?Add the SSH_KNOWN_HOSTS secret}"
          : "${SSH_TARGET_DIR:?Add the SSH_TARGET_DIR secret}"
          SSH_PORT="${SSH_PORT:-22}"

          if [[ ! "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] || ((SSH_PORT < 1 || SSH_PORT > 65535)); then
            echo 'SSH_PORT must be a number from 1 to 65535.' >&2
            exit 1
          fi
          if [[ ! "$SSH_USER" =~ ^[A-Za-z0-9_.-]+$ ]]; then
            echo 'SSH_USER contains unsupported characters.' >&2
            exit 1
          fi
          if [[ "$SSH_TARGET_DIR" != /* || "$SSH_TARGET_DIR" == '/' || "$SSH_TARGET_DIR" == *'..'* || "$SSH_TARGET_DIR" =~ [^A-Za-z0-9_./-] ]]; then
            echo 'SSH_TARGET_DIR must be an absolute path using letters, digits, dots, underscores, slashes, and hyphens.' >&2
            exit 1
          fi

          install -m 700 -d "$RUNNER_TEMP/deploy-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/deploy-ssh/id_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/deploy-ssh/id_key" "$RUNNER_TEMP/deploy-ssh/known_hosts"

          SSH_ARGS=(-p "$SSH_PORT" -i "$RUNNER_TEMP/deploy-ssh/id_key" -o IdentitiesOnly=yes -o "UserKnownHostsFile=$RUNNER_TEMP/deploy-ssh/known_hosts" -o StrictHostKeyChecking=yes)
          ssh "${SSH_ARGS[@]}" "$SSH_USER@$SSH_HOST" "mkdir -p -- '$SSH_TARGET_DIR'"
          rsync --archive --compress --delete \
            --rsh="ssh -p $SSH_PORT -i $RUNNER_TEMP/deploy-ssh/id_key -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/deploy-ssh/known_hosts -o StrictHostKeyChecking=yes" \
            dist/ "$SSH_USER@$SSH_HOST:$SSH_TARGET_DIR/"
